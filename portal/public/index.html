<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Библиотека КАВКАЗ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --sidebar-bg: #0D1520;
  --sidebar-w: 280px;
  --topbar-h: 56px;
  --accent: #D97706;
  --accent-l: #FEF3C7;
  --surface: #F1F5F9;
  --card-bg: #FFFFFF;
  --border: #E2E8F0;
  --text: #1E293B;
  --text-2: #64748B;
  --text-inv: #F8FAFC;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.06);
  --shadow-md: 0 4px 12px rgba(0,0,0,.10);
  --r: 8px;
  --danger: #DC2626;
  --success: #16A34A;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;font-size:14px;color:var(--text);background:var(--surface);display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ── TOPBAR ── */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);background:var(--sidebar-bg);display:flex;align-items:center;gap:12px;padding:0 16px;z-index:200;flex-shrink:0}
.topbar-brand{display:flex;align-items:center;gap:10px;min-width:calc(var(--sidebar-w) - 32px);color:var(--text-inv);font-weight:700;font-size:15px;white-space:nowrap}
.topbar-brand svg{flex-shrink:0;color:var(--accent)}
.search-wrap{flex:1;position:relative;max-width:480px}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#94A3B8;pointer-events:none}
#search-input{width:100%;height:36px;background:#1E2D40;border:1px solid #2D3F55;border-radius:var(--r);padding:0 12px 0 34px;color:var(--text-inv);font-size:14px;font-family:inherit;outline:none;transition:border-color .15s}
#search-input::placeholder{color:#64748B}
#search-input:focus{border-color:var(--accent)}
.tb-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn-admin{height:34px;padding:0 14px;border-radius:var(--r);border:1px solid #2D3F55;background:transparent;color:var(--text-inv);font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .15s}
.btn-admin:hover{background:#1E2D40}
.btn-admin.active{border-color:var(--accent);color:var(--accent)}

/* ── LAYOUT ── */
.layout{display:flex;margin-top:var(--topbar-h);height:calc(100vh - var(--topbar-h))}

/* ── SIDEBAR ── */
.sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);overflow-y:auto;flex-shrink:0;padding:12px 0}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:#2D3F55;border-radius:2px}
.tree-node{user-select:none}
.tree-row{display:flex;align-items:center;gap:0;padding:0 8px;min-height:32px;cursor:pointer;border-radius:6px;margin:0 6px;transition:background .12s;position:relative}
.tree-row:hover{background:#1E2D40}
.tree-row.active{background:#1E3A5F}
.tree-row.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;background:var(--accent);border-radius:0 2px 2px 0}
.tree-toggle{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#64748B;transition:transform .15s}
.tree-toggle.open{transform:rotate(90deg)}
.tree-toggle.leaf{visibility:hidden}
.tree-icon{color:#64748B;font-size:14px;margin-right:6px;flex-shrink:0}
.tree-label{font-size:12.5px;color:#CBD5E1;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.tree-row.active .tree-label{color:#F8FAFC}
.tree-children{padding-left:14px}

/* ── MAIN ── */
.main{flex:1;overflow-y:auto;padding:20px 24px}
.main::-webkit-scrollbar{width:6px}
.main::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}

/* Breadcrumb */
.breadcrumb{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-bottom:16px;font-size:13px;color:var(--text-2)}
.bc-sep{color:#CBD5E1}
.bc-item{cursor:pointer;padding:2px 4px;border-radius:4px;transition:color .12s}
.bc-item:hover{color:var(--accent)}
.bc-item.current{color:var(--text);font-weight:600;cursor:default}

/* Section header */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.section-title{font-size:18px;font-weight:700;color:var(--text);line-height:1.2}
.header-actions{display:flex;gap:8px}

/* Btn variants */
.btn{height:36px;padding:0 16px;border-radius:var(--r);border:none;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#B45309}
.btn-ghost{background:transparent;color:var(--text-2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--border)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#B91C1C}
.btn-sm{height:30px;padding:0 12px;font-size:12px}

/* File count badge */
.count-badge{font-size:12px;color:var(--text-2);background:var(--border);padding:3px 10px;border-radius:20px}

/* ── FILE GRID ── */
.file-list{display:flex;flex-direction:column;gap:6px}
.file-item{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;display:flex;align-items:center;gap:12px;transition:box-shadow .12s,border-color .12s;cursor:pointer}
.file-item:hover{box-shadow:var(--shadow-sm);border-color:#CBD5E1}
.file-item.is-folder{background:#F8FAFC;border-style:dashed}
.file-item.is-folder:hover{background:var(--accent-l);border-color:var(--accent)}

.ext-badge{width:40px;height:40px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0;letter-spacing:.5px}
.ext-pdf{background:#DC2626}
.ext-doc,.ext-docx{background:#1D4ED8}
.ext-xls,.ext-xlsx{background:#15803D}
.ext-ppt,.ext-pptx{background:#EA580C}
.ext-vsd,.ext-rar,.ext-zip{background:#7C3AED}
.ext-folder{background:#475569;font-size:18px}
.ext-other{background:#64748B}

.file-info{flex:1;min-width:0}
.file-name{font-size:13.5px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.file-item.is-folder .file-name{font-weight:600}
.file-meta{font-size:11.5px;color:var(--text-2);margin-top:3px;display:flex;gap:12px;flex-wrap:wrap}

.file-actions{display:flex;gap:6px;flex-shrink:0;opacity:0;transition:opacity .15s}
.file-item:hover .file-actions{opacity:1}
.icon-btn{width:30px;height:30px;border-radius:6px;border:1px solid var(--border);background:var(--card-bg);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-2);transition:all .12s}
.icon-btn:hover{background:var(--surface);border-color:#94A3B8;color:var(--text)}
.icon-btn.dl:hover{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:60px 20px;color:var(--text-2)}
.empty svg{width:48px;height:48px;margin-bottom:12px;opacity:.35}
.empty p{font-size:15px;font-weight:500;margin-bottom:6px}
.empty small{font-size:13px;opacity:.7}

/* ── UPLOAD ZONE ── */
.upload-zone{border:2px dashed var(--border);border-radius:var(--r);padding:32px;text-align:center;cursor:pointer;transition:all .15s;margin-bottom:16px;background:var(--card-bg)}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--accent);background:var(--accent-l)}
.upload-zone p{color:var(--text-2);font-size:13.5px;margin-top:8px}
.upload-zone strong{color:var(--accent)}
#file-input{display:none}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{background:var(--card-bg);border-radius:12px;padding:28px;width:100%;max-width:400px;box-shadow:var(--shadow-md);transform:translateY(12px);transition:transform .2s}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-title{font-size:17px;font-weight:700;margin-bottom:20px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--text-2)}
.form-group input{width:100%;height:40px;border:1px solid var(--border);border-radius:var(--r);padding:0 12px;font-size:14px;font-family:inherit;outline:none;transition:border-color .15s}
.form-group input:focus{border-color:var(--accent)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.modal-note{font-size:12.5px;color:var(--text-2);margin-top:8px;line-height:1.5}

/* New folder modal */
.modal-folder{max-width:360px}

/* Search results header */
.search-results-note{font-size:13px;color:var(--text-2);margin-bottom:12px;padding:8px 12px;background:var(--accent-l);border-radius:6px}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:#1E293B;color:#fff;padding:12px 18px;border-radius:var(--r);font-size:13px;font-weight:500;z-index:999;transform:translateY(12px);opacity:0;transition:all .25s;pointer-events:none;max-width:320px}
.toast.show{transform:translateY(0);opacity:1}
.toast.ok{background:#166534}
.toast.err{background:#991B1B}

/* Loading */
.loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--text-2);gap:8px;font-size:13.5px}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Welcome / Home */
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:8px}
.home-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--r);padding:16px;cursor:pointer;transition:all .15s}
.home-card:hover{box-shadow:var(--shadow-sm);border-color:var(--accent);background:var(--accent-l)}
.home-card-icon{font-size:24px;margin-bottom:8px}
.home-card-name{font-size:13px;font-weight:600;color:var(--text);line-height:1.3}
.home-card-count{font-size:12px;color:var(--text-2);margin-top:4px}

/* ── DOCX VIEWER ── */
.viewer-overlay{padding:0}
.viewer-container{background:var(--card-bg);border-radius:12px;display:flex;flex-direction:column;width:94vw;max-width:920px;height:92vh;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.35);transform:translateY(24px);transition:transform .2s}
.modal-overlay.open .viewer-container{transform:translateY(0)}
.viewer-header{display:flex;align-items:center;gap:10px;padding:13px 16px;background:var(--sidebar-bg);border-radius:12px 12px 0 0;flex-shrink:0}
.viewer-header-title{flex:1;font-size:13px;font-weight:600;color:var(--text-inv);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer-header .btn-ghost{color:#CBD5E1;border-color:#2D3F55;flex-shrink:0}
.viewer-header .btn-ghost:hover{background:#1E2D40}
.viewer-header .icon-btn{background:transparent;border-color:#2D3F55;color:#CBD5E1;flex-shrink:0}
.viewer-header .icon-btn:hover{background:#1E2D40;color:#fff}
.viewer-body{flex:1;overflow-y:auto;background:#D1D5DB;padding:24px}
.viewer-body::-webkit-scrollbar{width:7px}
.viewer-body::-webkit-scrollbar-thumb{background:#9CA3AF;border-radius:4px}
.docx-content{background:#fff;max-width:800px;margin:0 auto;padding:56px 64px;box-shadow:0 2px 12px rgba(0,0,0,.15);font-family:'Times New Roman',Times,serif;font-size:12pt;line-height:1.6;color:#111;word-wrap:break-word}
.docx-content h1{font-size:16pt;font-weight:700;margin:18px 0 10px;text-align:center}
.docx-content h2{font-size:14pt;font-weight:700;margin:14px 0 8px}
.docx-content h3{font-size:13pt;font-weight:700;margin:12px 0 6px}
.docx-content p{margin:6px 0;text-align:justify}
.docx-content table{border-collapse:collapse;width:100%;margin:14px 0;font-size:10pt}
.docx-content td,.docx-content th{border:1px solid #aaa;padding:5px 8px;vertical-align:top}
.docx-content ul,.docx-content ol{padding-left:28px;margin:8px 0}
.docx-content li{margin:3px 0}
.docx-content img{max-width:100%;height:auto}
.docx-content strong,.docx-content b{font-weight:700}
.docx-content em,.docx-content i{font-style:italic}
.viewer-unavail{text-align:center;padding:60px 24px;color:var(--text-2)}
.viewer-unavail p{font-size:15px;font-weight:500;margin-bottom:8px}
.viewer-unavail small{font-size:13px;opacity:.75;display:block;margin-bottom:20px;line-height:1.6}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    Библиотека КАВКАЗ
  </div>
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="search-input" type="text" placeholder="Поиск по документам… (Ctrl+K)" autocomplete="off">
  </div>
  <div class="tb-actions">
    <a href="/stats.html" id="stats-btn" class="btn-admin" style="display:none;text-decoration:none">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      Аналитика
    </a>
    <button class="btn-admin" id="admin-btn" onclick="openAdminModal()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      <span id="admin-label">Войти</span>
    </button>
  </div>
</div>

<!-- LAYOUT -->
<div class="layout">
  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar">
    <div class="loading"><div class="spinner"></div> Загрузка…</div>
  </nav>

  <!-- MAIN -->
  <main class="main" id="main-content">
    <div class="loading"><div class="spinner"></div> Загрузка…</div>
  </main>
</div>

<!-- MODAL: Admin login / setup -->
<div class="modal-overlay" id="admin-modal">
  <div class="modal">
    <div class="modal-title" id="modal-title">Вход для администратора</div>
    <div id="modal-body">
      <div class="form-group">
        <label id="pw-label">Пароль</label>
        <input type="password" id="pw-input" placeholder="Введите пароль" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div id="modal-note" class="modal-note"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('admin-modal')">Отмена</button>
      <button class="btn btn-primary" id="login-btn" onclick="doLogin()">Войти</button>
    </div>
  </div>
</div>

<!-- MODAL: Новая папка -->
<div class="modal-overlay" id="folder-modal">
  <div class="modal modal-folder">
    <div class="modal-title">Новая папка</div>
    <div class="form-group">
      <label>Название папки</label>
      <input type="text" id="folder-name-input" placeholder="Например: 2025 год" onkeydown="if(event.key==='Enter')doMkdir()">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('folder-modal')">Отмена</button>
      <button class="btn btn-primary" onclick="doMkdir()">Создать</button>
    </div>
  </div>
</div>

<!-- MODAL: DOCX viewer -->
<div class="modal-overlay viewer-overlay" id="viewer-modal">
  <div class="viewer-container">
    <div class="viewer-header">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span class="viewer-header-title" id="viewer-title"></span>
      <button class="btn btn-ghost btn-sm" onclick="downloadViewed()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Скачать
      </button>
      <button class="icon-btn" onclick="closeModal('viewer-modal')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="viewer-body" id="viewer-body"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Hidden file input -->
<input type="file" id="file-input" multiple onchange="onFilesPicked(this.files)">

<script>
// ── Состояние ─────────────────────────────────────────────────────────────────
const S = {
  tree: [],
  currentPath: '',
  files: [],
  token: localStorage.getItem('lib_token'),
  isAdmin: false,
  expanded: new Set(),
  searchMode: false
};

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  await checkAdminStatus();
  await loadTree();
  renderHome();
  document.getElementById('search-input').addEventListener('input', onSearch);
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
      e.preventDefault();
      document.getElementById('search-input').focus();
    }
  });
}

// ── Auth ──────────────────────────────────────────────────────────────────────
let adminConfigured = false;

async function checkAdminStatus() {
  try {
    const r = await fetch('/api/admin-status');
    const d = await r.json();
    adminConfigured = d.configured;
  } catch {}

  if (S.token) {
    // Проверяем токен
    try {
      const payload = JSON.parse(atob(S.token.split('.')[1]));
      if (payload.exp * 1000 > Date.now()) {
        S.isAdmin = true;
        updateAdminUI();
        return;
      }
    } catch {}
    S.token = null;
    localStorage.removeItem('lib_token');
  }
}

function updateAdminUI() {
  const btn = document.getElementById('admin-btn');
  const lbl = document.getElementById('admin-label');
  const statsBtn = document.getElementById('stats-btn');
  if (S.isAdmin) {
    btn.classList.add('active');
    lbl.textContent = 'Выйти';
    btn.onclick = logout;
    statsBtn.style.display = 'flex';
  } else {
    btn.classList.remove('active');
    lbl.textContent = 'Войти';
    btn.onclick = openAdminModal;
    statsBtn.style.display = 'none';
  }
}

function openAdminModal() {
  const title = document.getElementById('modal-title');
  const note = document.getElementById('modal-note');
  const pwLabel = document.getElementById('pw-label');
  const btn = document.getElementById('login-btn');
  if (!adminConfigured) {
    title.textContent = 'Создать пароль администратора';
    note.textContent = 'Первый запуск. Установите пароль для управления библиотекой (минимум 6 символов).';
    pwLabel.textContent = 'Новый пароль';
    btn.textContent = 'Установить';
    btn.onclick = doSetup;
  } else {
    title.textContent = 'Вход для администратора';
    note.textContent = '';
    pwLabel.textContent = 'Пароль';
    btn.textContent = 'Войти';
    btn.onclick = doLogin;
  }
  document.getElementById('pw-input').value = '';
  openModal('admin-modal');
  setTimeout(() => document.getElementById('pw-input').focus(), 200);
}

async function doSetup() {
  const pw = document.getElementById('pw-input').value;
  try {
    const r = await fetch('/api/setup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) });
    const d = await r.json();
    if (!r.ok) { showToast(d.error, 'err'); return; }
    adminConfigured = true;
    closeModal('admin-modal');
    await doLogin();
  } catch { showToast('Ошибка сети', 'err'); }
}

async function doLogin() {
  const pw = document.getElementById('pw-input').value;
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) });
    const d = await r.json();
    if (!r.ok) { showToast(d.error, 'err'); return; }
    S.token = d.token;
    S.isAdmin = true;
    localStorage.setItem('lib_token', d.token);
    closeModal('admin-modal');
    updateAdminUI();
    showToast('Вы вошли как администратор', 'ok');
    if (S.currentPath !== undefined) renderCurrentView();
  } catch { showToast('Ошибка сети', 'err'); }
}

function logout() {
  S.token = null;
  S.isAdmin = false;
  localStorage.removeItem('lib_token');
  updateAdminUI();
  showToast('Вы вышли из системы');
  renderCurrentView();
}

// ── Tree ──────────────────────────────────────────────────────────────────────
async function loadTree() {
  try {
    const r = await fetch('/api/tree');
    S.tree = await r.json();
    renderSidebar();
  } catch {
    document.getElementById('sidebar').innerHTML = '<p style="color:#64748B;padding:16px;font-size:12px">Ошибка загрузки</p>';
  }
}

function renderSidebar() {
  const el = document.getElementById('sidebar');
  el.innerHTML = renderTreeNodes(S.tree, 0);
}

function renderTreeNodes(nodes, depth) {
  return nodes.map(n => {
    const hasChildren = n.children && n.children.length > 0;
    const isOpen = S.expanded.has(n.path);
    const isActive = S.currentPath === n.path;
    const indent = depth * 14;
    return `
      <div class="tree-node">
        <div class="tree-row${isActive ? ' active' : ''}" onclick="selectFolder('${esc(n.path)}')" style="padding-left:${8 + indent}px">
          <span class="tree-toggle${!hasChildren ? ' leaf' : (isOpen ? ' open' : '')}"
                onclick="event.stopPropagation();toggleNode('${esc(n.path)}')">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><polygon points="2,1 9,5 2,9"/></svg>
          </span>
          <span class="tree-icon">${hasChildren ? '📁' : '📄'}</span>
          <span class="tree-label" title="${esc(n.name)}">${esc(n.name)}</span>
        </div>
        ${isOpen && hasChildren ? `<div class="tree-children">${renderTreeNodes(n.children, depth + 1)}</div>` : ''}
      </div>`;
  }).join('');
}

function toggleNode(p) {
  if (S.expanded.has(p)) S.expanded.delete(p); else S.expanded.add(p);
  renderSidebar();
}

function selectFolder(p) {
  S.currentPath = p;
  S.searchMode = false;
  document.getElementById('search-input').value = '';
  // Expand parent nodes
  const parts = p.split('/');
  for (let i = 1; i < parts.length; i++) S.expanded.add(parts.slice(0, i).join('/'));
  renderSidebar();
  loadFiles(p);
}

// ── Files ─────────────────────────────────────────────────────────────────────
async function loadFiles(folderPath) {
  renderLoading();
  try {
    const url = '/api/files' + (folderPath ? '?path=' + encodeURIComponent(folderPath) : '');
    const r = await fetch(url);
    S.files = await r.json();
    renderFileList(S.files, folderPath);
  } catch {
    showToast('Ошибка загрузки файлов', 'err');
  }
}

function renderHome() {
  const main = document.getElementById('main-content');
  const cards = S.tree.map(n => {
    const fileCount = countFiles(n);
    return `<div class="home-card" onclick="selectFolder('${esc(n.path)}')">
      <div class="home-card-icon">📁</div>
      <div class="home-card-name">${esc(n.name)}</div>
      <div class="home-card-count">${fileCount} документов</div>
    </div>`;
  }).join('');
  main.innerHTML = `
    <div class="section-header">
      <div class="section-title">Библиотека документов</div>
    </div>
    <div class="home-grid">${cards || '<p style="color:var(--text-2)">Загрузка разделов…</p>'}</div>`;
}

function countFiles(node) {
  let c = 0;
  function walk(n) { c += (n.children || []).length; (n.children || []).forEach(walk); }
  walk(node);
  return c || '—';
}

function renderCurrentView() {
  if (S.searchMode) return;
  if (!S.currentPath) { renderHome(); return; }
  loadFiles(S.currentPath);
}

function renderLoading() {
  document.getElementById('main-content').innerHTML = '<div class="loading"><div class="spinner"></div> Загрузка…</div>';
}

function renderFileList(items, folderPath) {
  const main = document.getElementById('main-content');

  // Breadcrumb
  const bc = buildBreadcrumb(folderPath);

  // Upload zone (admin)
  const uploadZone = S.isAdmin ? `
    <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()"
         ondragover="event.preventDefault();this.classList.add('dragover')"
         ondragleave="this.classList.remove('dragover')"
         ondrop="event.preventDefault();this.classList.remove('dragover');onFilesPicked(event.dataTransfer.files)">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <p><strong>Нажмите</strong> или перетащите файлы для загрузки</p>
    </div>` : '';

  // Header actions
  const headerActions = S.isAdmin ? `
    <div class="header-actions">
      <button class="btn btn-ghost btn-sm" onclick="openFolderModal()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Новая папка
      </button>
      <button class="btn btn-primary btn-sm" onclick="document.getElementById('file-input').click()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Загрузить
      </button>
    </div>` : '';

  const files = items.filter(i => i.type === 'file');
  const folders = items.filter(i => i.type === 'folder');

  const listHtml = items.length === 0
    ? `<div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        <p>Папка пуста</p>
        <small>${S.isAdmin ? 'Загрузите первый документ' : 'Документов пока нет'}</small>
       </div>`
    : `<div class="file-list">${items.map(renderItem).join('')}</div>`;

  const countText = files.length > 0 ? `<span class="count-badge">${files.length} ${plural(files.length,'документ','документа','документов')}</span>` : '';

  main.innerHTML = `
    ${bc}
    <div class="section-header">
      <div class="section-title" style="font-size:15px">${esc(folderName(folderPath))} ${countText}</div>
      ${headerActions}
    </div>
    ${uploadZone}
    ${listHtml}`;
}

function folderName(p) {
  if (!p) return 'Библиотека';
  return p.split('/').pop();
}

function renderItem(item) {
  if (item.type === 'folder') {
    return `<div class="file-item is-folder" onclick="selectFolder('${esc(item.path)}')">
      <div class="ext-badge ext-folder">📁</div>
      <div class="file-info">
        <div class="file-name">${esc(item.name)}</div>
        <div class="file-meta"><span>Папка</span></div>
      </div>
      <div class="file-actions" style="opacity:1">
        <button class="icon-btn" title="Открыть" onclick="event.stopPropagation();selectFolder('${esc(item.path)}')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </div>`;
  }
  const ext = item.name.split('.').pop().toLowerCase();
  const badgeCls = getBadgeCls(ext);
  const sizeStr = fmtSize(item.size);
  const dateStr = fmtDate(item.modified);
  return `<div class="file-item" onclick="openFile('${esc(item.path)}')">
    <div class="ext-badge ${badgeCls}">${ext.toUpperCase().slice(0,4)}</div>
    <div class="file-info">
      <div class="file-name" title="${esc(item.name)}">${esc(item.name)}</div>
      <div class="file-meta"><span>${sizeStr}</span><span>${dateStr}</span></div>
    </div>
    <div class="file-actions">
      <button class="icon-btn dl" title="Скачать" onclick="event.stopPropagation();downloadFile('${esc(item.path)}')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
    </div>
  </div>`;
}

function getBadgeCls(ext) {
  if (ext === 'pdf') return 'ext-pdf';
  if (['doc','docx'].includes(ext)) return 'ext-doc';
  if (['xls','xlsx'].includes(ext)) return 'ext-xls';
  if (['ppt','pptx'].includes(ext)) return 'ext-ppt';
  if (['vsd','rar','zip'].includes(ext)) return 'ext-vsd';
  return 'ext-other';
}

// ── Breadcrumb ─────────────────────────────────────────────────────────────────
function buildBreadcrumb(folderPath) {
  const parts = folderPath ? folderPath.split('/') : [];
  let html = `<div class="breadcrumb">
    <span class="bc-item" onclick="goHome()">🏠 Главная</span>`;
  let accumulated = '';
  for (let i = 0; i < parts.length; i++) {
    accumulated += (accumulated ? '/' : '') + parts[i];
    const isLast = i === parts.length - 1;
    const p = accumulated;
    html += `<span class="bc-sep">›</span>
      <span class="bc-item${isLast ? ' current' : ''}"
            ${isLast ? '' : `onclick="selectFolder('${esc(p)}')"`}
            title="${esc(parts[i])}">${esc(parts[i].replace(/^\d+\.\s*/, ''))}</span>`;
  }
  return html + '</div>';
}

function goHome() {
  S.currentPath = '';
  S.searchMode = false;
  document.getElementById('search-input').value = '';
  renderSidebar();
  renderHome();
}

// ── Search ────────────────────────────────────────────────────────────────────
let searchTimer;
async function onSearch(e) {
  const q = e.target.value.trim();
  clearTimeout(searchTimer);
  if (!q) {
    S.searchMode = false;
    renderCurrentView();
    return;
  }
  if (q.length < 2) return;
  S.searchMode = true;
  searchTimer = setTimeout(async () => {
    renderLoading();
    try {
      const r = await fetch('/api/search?q=' + encodeURIComponent(q));
      const results = await r.json();
      renderSearchResults(results, q);
    } catch { showToast('Ошибка поиска', 'err'); }
  }, 300);
}

function renderSearchResults(results, q) {
  // Логируем поисковый запрос (fire and forget)
  fetch('/api/log/search', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ q, n: results.length }) }).catch(()=>{});

  const main = document.getElementById('main-content');
  const listHtml = results.length === 0
    ? `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><p>Ничего не найдено</p><small>Попробуйте другой запрос</small></div>`
    : `<div class="file-list">${results.map(renderSearchItem).join('')}</div>`;
  main.innerHTML = `
    <div class="section-header">
      <div class="section-title">Результаты поиска <span class="count-badge">${results.length}</span></div>
    </div>
    <div class="search-results-note">Поиск по запросу: «${esc(q)}»${results.length === 100 ? ' — показаны первые 100 результатов' : ''}</div>
    ${listHtml}`;
}

function renderSearchItem(item) {
  const ext = item.name.split('.').pop().toLowerCase();
  const folder = item.path.split('/').slice(0,-1).join('/');
  return `<div class="file-item" onclick="openFile('${esc(item.path)}')">
    <div class="ext-badge ${getBadgeCls(ext)}">${ext.toUpperCase().slice(0,4)}</div>
    <div class="file-info">
      <div class="file-name" title="${esc(item.name)}">${esc(item.name)}</div>
      <div class="file-meta">
        <span>${fmtSize(item.size)}</span>
        <span style="cursor:pointer;color:var(--accent)" onclick="event.stopPropagation();selectFolder('${esc(folder)}')" title="Открыть раздел">📂 ${esc(folder.split('/').pop())}</span>
      </div>
    </div>
    <div class="file-actions">
      <button class="icon-btn dl" title="Скачать" onclick="event.stopPropagation();downloadFile('${esc(item.path)}')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
    </div>
  </div>`;
}

// ── View / Download ───────────────────────────────────────────────────────────
function openFile(filePath) {
  // Логируем открытие файла (fire and forget)
  fetch('/api/log/open', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ p: filePath }) }).catch(()=>{});

  const ext = filePath.split('.').pop().toLowerCase();
  if (ext === 'docx') {
    openDocxViewer(filePath);
  } else if (ext === 'doc') {
    openDocFallback(filePath);
  } else {
    window.open('/api/view?path=' + encodeURIComponent(filePath), '_blank');
  }
}

function downloadFile(filePath) {
  const a = document.createElement('a');
  a.href = '/api/download?path=' + encodeURIComponent(filePath);
  a.download = filePath.split('/').pop();
  a.click();
}

// ── DOCX viewer ───────────────────────────────────────────────────────────────
let viewerPath = '';

async function openDocxViewer(filePath) {
  viewerPath = filePath;
  document.getElementById('viewer-title').textContent = filePath.split('/').pop();
  document.getElementById('viewer-body').innerHTML = '<div class="loading"><div class="spinner"></div> Загрузка документа…</div>';
  openModal('viewer-modal');
  try {
    const r = await fetch('/api/docx-html?path=' + encodeURIComponent(filePath));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Ошибка сервера');
    document.getElementById('viewer-body').innerHTML = `<div class="docx-content">${d.html}</div>`;
  } catch (e) {
    document.getElementById('viewer-body').innerHTML = `
      <div class="viewer-unavail">
        <p>Не удалось открыть документ</p>
        <small>${esc(e.message)}</small>
        <button class="btn btn-primary btn-sm" onclick="downloadViewed()">Скачать файл</button>
      </div>`;
  }
}

function openDocFallback(filePath) {
  viewerPath = filePath;
  const name = filePath.split('/').pop();
  document.getElementById('viewer-title').textContent = name;
  document.getElementById('viewer-body').innerHTML = `
    <div class="viewer-unavail">
      <p>Предпросмотр недоступен</p>
      <small>Формат .doc (старый Word) не поддерживается для просмотра в браузере.<br>Скачайте файл и откройте в Microsoft Word.</small>
      <button class="btn btn-primary btn-sm" onclick="downloadViewed()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Скачать ${esc(name)}
      </button>
    </div>`;
  openModal('viewer-modal');
}

function downloadViewed() {
  if (viewerPath) downloadFile(viewerPath);
}

// ── Upload ────────────────────────────────────────────────────────────────────
async function onFilesPicked(fileList) {
  if (!fileList || !fileList.length) return;
  const files = Array.from(fileList);
  const targetPath = S.currentPath;
  const form = new FormData();
  if (targetPath) form.append('path', targetPath);
  files.forEach(f => form.append('files', f));
  showToast(`Загружаем ${files.length} ${plural(files.length,'файл','файла','файлов')}…`);
  try {
    const r = await fetch('/api/upload', { method: 'POST', headers: { Authorization: 'Bearer ' + S.token }, body: form });
    const d = await r.json();
    if (!r.ok) { showToast(d.error, 'err'); return; }
    showToast(`Загружено: ${d.uploaded.join(', ').slice(0,80)}`, 'ok');
    await loadFiles(targetPath);
    document.getElementById('file-input').value = '';
  } catch { showToast('Ошибка загрузки', 'err'); }
}

// ── New folder ────────────────────────────────────────────────────────────────
function openFolderModal() {
  document.getElementById('folder-name-input').value = '';
  openModal('folder-modal');
  setTimeout(() => document.getElementById('folder-name-input').focus(), 200);
}

async function doMkdir() {
  const name = document.getElementById('folder-name-input').value.trim();
  if (!name) { showToast('Введите название', 'err'); return; }
  const targetPath = S.currentPath ? S.currentPath + '/' + name : name;
  try {
    const r = await fetch('/api/mkdir', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + S.token }, body: JSON.stringify({ path: targetPath }) });
    const d = await r.json();
    if (!r.ok) { showToast(d.error, 'err'); return; }
    closeModal('folder-modal');
    showToast('Папка создана', 'ok');
    await loadTree();
    await loadFiles(S.currentPath);
  } catch { showToast('Ошибка', 'err'); }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' Б';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(0) + ' КБ';
  return (bytes/1024/1024).toFixed(1) + ' МБ';
}

function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  return dt.toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit', year:'numeric' });
}

function plural(n, one, few, many) {
  const mod10 = n % 10, mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return one;
  if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return few;
  return many;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) el.classList.remove('open'); });
});

let toastTimer;
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Start ─────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
